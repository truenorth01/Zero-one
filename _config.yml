title: Zero-one
description: "A voluntary, evidence-labeled living review of the 2026–2036 gates for human–AI cognitive coupling."
url: "https://truenorth01.github.io"
baseurl: "/Zero-one"
lang: en-US
theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/social-card.png
        width: 1200
        height: 630
        alt: "Zero-one: a living review of the evidence for human-AI coupling"
  - scope:
      path: "README.md"
    values:
      title: "Zero-one"
exclude:
  - CITATION.cff
